<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元玺 v1.8.1 更新日志预览</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#f3f5fa; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; color:#252938; }
  .meta { max-width:948px; margin:32px auto 0; padding:26px 32px; background:linear-gradient(135deg,#172b72,#6546d7); border-radius:18px; color:#fff; box-shadow:0 12px 34px rgba(41,45,122,.2); }
  .meta h1 { margin:0 0 9px; font-size:28px; line-height:1.35; }
  .meta p { margin:5px 0; font-size:15px; line-height:1.7; opacity:.94; }
  .meta .tag { display:inline-block; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:3px 11px; font-size:12px; margin:9px 7px 0 0; }
  .card { max-width:948px; margin:20px auto 64px; background:#fff; border-radius:18px; padding:40px 50px; box-shadow:0 6px 30px rgba(52,59,105,.09); line-height:1.8; }
  .card > h2:first-child { margin-top:0; font-size:28px; border-bottom:none; }
  .card img { max-width:100%; border-radius:12px; display:block; margin:22px auto 28px; box-shadow:0 4px 18px rgba(45,59,125,.13); }
  .card img.scenario-image { max-width:94%; border:1px solid #e8ebf6; box-shadow:0 3px 14px rgba(45,59,125,.09); }
  .card h2 { border-bottom:1px solid #e9ebf3; padding-bottom:10px; margin-top:44px; line-height:1.45; }
  .card h2.core-heading { border:0; border-left:5px solid #5368f5; border-radius:10px; padding:12px 16px; background:linear-gradient(90deg,#eef2ff 0%,#f8f6ff 68%,#fff 100%); color:#172b72; }
  .card h2.important-heading { color:#33417d; border-bottom:2px solid #dfe4f8; }
  .card h3 { margin-top:30px; color:#28345f; }
  .card h4 { margin:28px 0 10px; color:#3a4380; font-size:17px; }
  .card p { margin:11px 0; }
  .card hr { border:none; border-top:1px solid #e9ebf3; margin:38px 0; }
  .card li { margin:7px 0; }
  .card strong { color:#253a9b; }
  @media (max-width: 720px) {
    .meta { margin:16px 14px 0; padding:22px; border-radius:14px; }
    .meta h1 { font-size:23px; }
    .card { margin:14px 14px 40px; padding:26px 20px; border-radius:14px; }
    .card > h2:first-child { font-size:24px; }
    .card h2 { font-size:21px; }
    .card img.scenario-image { max-width:100%; }
  }
</style>
</head>
<body>
<header class="meta">
  <h1>Agent 档位选择与任务 Web Push 通知</h1>
  <p>按任务难度选用元玺 Lite、Pro、Max；任务完成后可通过浏览器推送提醒，离开页面也不容易错过结果。</p>
  <div><span class="tag">v1.8.1</span><span class="tag">2026.09.11</span><span class="tag">功能更新</span></div>
</header>
<main class="card" id="content"></main>
<script>
const md = `## 元玺 v1.8.1 更新日志

![元玺 v1.8.1 封面图](images/1.8.1_cover.png?v=14)

本次更新新增 **Agent 档位选择** 和 **任务 Web Push 通知**：日常任务可选用更轻的档位，长时间任务完成后浏览器会提醒你。

---

## 核心升级一：Agent 档位选择

### 按任务难度选档，不必一律拉满

![Agent 档位选择配图](images/1.8.1_content_1.png?v=14)

对话中可选三档：

- **元玺 Lite**：日常轻量任务
- **元玺 Pro**：大多数复杂任务
- **元玺 Max**：高难复杂任务

整理纪要、改邮件用 Lite；方案和 PPT 用 Pro；高难度推演、多约束规划再用 Max。

![Agent 档位选择场景案例](images/1.8.1_content_2.png?v=14)

同一条会议纪要做过一次对照：Lite 大约 0.2 积分，Pro 大约是 2 倍，Max 大约是 8 倍。这是一次实测的量级，不是固定单价，实际以当次任务为准。

![同一任务三档积分对照](images/1.8.1_content_5.png?v=14)

---

## 核心升级二：任务 Web Push 通知

### 任务还在跑，人可以先去忙别的

![任务 Web Push 通知配图](images/1.8.1_content_3.png?v=14)

做 PPT、写长报告、跑推演时不必一直守着页面。任务完成后，浏览器会弹出提醒，点开即可回到会话。

![任务 Web Push 通知场景案例](images/1.8.1_content_4.png?v=14)

报告还在生成时可以先去开会，完成后会收到通知。

---

感谢每一位用户的信任与支持。

**元玺，让 AI 成为你的超能力。**
`;

const content = document.getElementById('content');
content.innerHTML = marked.parse(md);
content.querySelectorAll('h2').forEach((heading) => {
  if (heading.textContent.includes('核心升级')) heading.classList.add('core-heading');
  if (heading.textContent.includes('重要体验升级')) heading.classList.add('important-heading');
});
content.querySelectorAll('img').forEach((img) => {
  if (img.alt.includes('场景案例')) img.classList.add('scenario-image');
});
</script>
</body>
</html>
